name: Frontend Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm run test:ci

  e2e-tests:
    name: E2E Cross-Browser Tests
    runs-on: ${{ matrix.browser == 'edge' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 30
    
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit, edge]
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium firefox webkit
      if: matrix.browser != 'edge'

    - name: Install Edge
      if: matrix.browser == 'edge'
      run: npx playwright install --with-deps msedge

    - name: Build application
      run: npm run build

    - name: Run Playwright tests
      run: npx playwright test --project=${{ matrix.browser }}-latest
      env:
        PLAYWRIGHT_BASE_URL: http://localhost:3000

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-html-report-${{ matrix.browser }}
        path: playwright-report/
        retention-days: 7

    - name: Upload JSON results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-json-results-${{ matrix.browser }}
        path: playwright-report/results.json
        retention-days: 7

    - name: Upload test results and traces
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-traces-${{ matrix.browser }}
        path: test-results/
        retention-days: 7

  e2e-tests-extended:
    name: E2E Extended Viewport Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    
    strategy:
      fail-fast: false
      matrix:
        viewport: [tablet-chrome, tablet-safari, mobile-chrome, mobile-safari]
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Build application
      run: npm run build

    - name: Run Playwright tests
      run: npx playwright test --project=${{ matrix.viewport }}
      env:
        PLAYWRIGHT_BASE_URL: http://localhost:3000

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-${{ matrix.viewport }}
        path: playwright-report/
        retention-days: 14

  e2e-tests-platform-specific:
    name: E2E Platform-Specific Tests
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        browser: [chromium-latest, firefox-latest, webkit-latest, edge-latest]
        exclude:
          - os: windows-latest
            browser: webkit-latest
          - os: macos-latest
            browser: edge-latest
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Build application
      run: npm run build

    - name: Run Playwright tests
      run: npx playwright test --project=${{ matrix.browser }}
      env:
        PLAYWRIGHT_BASE_URL: http://localhost:3000

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-${{ matrix.os }}-${{ matrix.browser }}
        path: playwright-report/
        retention-days: 14

  e2e-tests-nightly:
    name: E2E Nightly Comprehensive Tests
    runs-on: ${{ (contains(matrix.project, 'edge') && 'windows-latest') || 'ubuntu-latest' }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-latest, chromium-previous, firefox-latest, firefox-previous, webkit-latest, webkit-previous, edge-latest, edge-previous, tablet-chrome, tablet-safari, mobile-chrome, mobile-safari]
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      if: ${{ !contains(matrix.project, 'edge') }}

    - name: Install Edge
      if: ${{ contains(matrix.project, 'edge') }}
      run: npx playwright install --with-deps msedge

    - name: Build application
      run: npm run build

    - name: Run Playwright tests
      run: npx playwright test --project=${{ matrix.project }}
      env:
        PLAYWRIGHT_BASE_URL: http://localhost:3000

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-nightly-${{ matrix.project }}
        path: playwright-report/
        retention-days: 30

  e2e-tests-browser-versions:
    name: E2E Browser Version Matrix
    runs-on: ${{ (contains(matrix.project, 'edge') && 'windows-latest') || 'ubuntu-latest' }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-latest, chromium-previous, firefox-latest, firefox-previous, webkit-latest, webkit-previous, edge-latest, edge-previous]
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      if: ${{ !contains(matrix.project, 'edge') }}

    - name: Install Edge
      if: ${{ contains(matrix.project, 'edge') }}
      run: npx playwright install --with-deps msedge

    - name: Build application
      run: npm run build

    - name: Run Playwright tests
      run: npx playwright test --project=${{ matrix.project }}
      env:
        PLAYWRIGHT_BASE_URL: http://localhost:3000

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-versions-${{ matrix.project }}
        path: playwright-report/
        retention-days: 30

  test-report-summary:
    name: Test Result Summary
    needs: [e2e-tests, e2e-tests-extended, e2e-tests-platform-specific]
    if: always()
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Aggregate Results
      id: aggregate
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const artifactsPath = path.join(process.cwd(), 'artifacts');
          
          let summary = '# E2E Test Results Summary\n\n';
          summary += '| Browser/Platform | Status | Tests | Passed | Failed | Flaky | Skips |\n';
          summary += '|-----------------|--------|-------|--------|--------|-------|-------|\n';
          
          // Logic to find and parse results.json files in artifacts
          // This is a simplified placeholder as per the plan requirements
          summary += '| Aggregated Results | 📊 | TBD | TBD | TBD | TBD | TBD |\n';
          
          fs.writeFileSync('test-summary.md', summary);
          
    - name: Post Summary to PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('test-summary.md', 'utf8');
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });

    - name: Upload Summary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: test-summary-report
        path: test-summary.md
