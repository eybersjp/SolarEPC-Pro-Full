name: Full Stack Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e-integration:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest] # Windows disabled for now due to Docker Desktop dependency complexity in GHA

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Install Docker Compose
      run: |
        sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose
        
    - name: Build and Start Services
      run: docker-compose -f docker-compose.prod.yml up -d --build
      
    - name: Wait for Backend
      run: |
        timeout 60s bash -c 'until curl --silent --fail http://localhost:8000/health; do sleep 5; done'
        
    - name: Run Migrations
      run: docker-compose -f docker-compose.prod.yml exec -T backend alembic upgrade head
      
    - name: Seed Data
      run: docker-compose -f docker-compose.prod.yml exec -T backend python scripts/seed_equipment.py
      
    - name: Seed Tenants
      run: docker-compose -f docker-compose.prod.yml exec -T backend python scripts/seed_tenants.py
      
    - name: Install Playwright
      working-directory: ./frontend
      run: |
        npm ci
        npx playwright install --with-deps
        
    - name: Run E2E Tests
      working-directory: ./frontend
      env:
        PLAYWRIGHT_BASE_URL: http://localhost:80 # Frontend container port
        # Or if running from host against localhost mapped port
      run: npx playwright test
      
    - name: Upload Logs
      if: failure()
      run: docker-compose -f docker-compose.prod.yml logs > docker-logs.txt
      
    - name: Upload Artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: error-logs
        path: |
          docker-logs.txt
          frontend/playwright-report/
